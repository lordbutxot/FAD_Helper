services:
  - type: web
    name: fad-helper
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db_simple.py && gunicorn app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
