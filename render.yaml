services:
  - type: web
    name: fad-helper
    env: python
    buildCommand: pip install -r requirements.txt; python -c "from app import app, db; app.app_context().push(); db.create_all(); print('✅ Database tables created')"
    startCommand: gunicorn app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
