services:
  - type: web
    name: fad-helper
    env: python
    buildCommand: pip install -r requirements.txt && python init_production_db.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fad-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: fad-db
    databaseName: fad_lists
    user: fad_user
