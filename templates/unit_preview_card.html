<!-- Live Unit Preview Card Component -->
<div class="card border-primary" id="unitPreview" style="display: none;">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-eye"></i> Unit Preview</h5>
    </div>
    <div class="card-body">
        <h4 id="preview-name" class="card-title">Unnamed Unit</h4>
        <p class="text-muted mb-2" id="preview-faction">No Faction</p>
        
        <div class="row mb-3">
            <div class="col-6">
                <small class="text-muted">Type:</small>
                <div id="preview-type" class="fw-bold">-</div>
            </div>
            <div class="col-6">
                <small class="text-muted">Total Points:</small>
                <div id="preview-points" class="fw-bold text-danger fs-4">0</div>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-6">
                <small class="text-muted">Quality:</small>
                <div id="preview-quality" class="fw-bold">-</div>
            </div>
            <div class="col-6">
                <small class="text-muted">Resolve:</small>
                <div id="preview-resolve" class="fw-bold">-</div>
            </div>
        </div>
        
        <div id="preview-size-container" class="mb-3" style="display: none;">
            <small class="text-muted">Squad Size:</small>
            <div id="preview-size" class="fw-bold">-</div>
        </div>
        
        <div id="preview-armour-container" class="mb-3">
            <small class="text-muted">Armour:</small>
            <div id="preview-armour">None</div>
        </div>
        
        <div id="preview-weapon-container" class="mb-3">
            <small class="text-muted">Primary Weapon:</small>
            <div id="preview-weapon">None</div>
        </div>
        
        <div id="preview-traits-container" class="mb-3" style="display: none;">
            <small class="text-muted">Traits:</small>
            <div id="preview-traits">
                <span class="badge bg-secondary">None</span>
            </div>
        </div>
    </div>
</div>

<!-- Tooltip Styles -->
<style>
    .tooltip-trigger {
        cursor: help;
        border-bottom: 1px dotted currentColor;
    }
    
    [data-bs-toggle="tooltip"] {
        cursor: pointer;
    }
    
    .trait-option, .equipment-option {
        position: relative;
    }
    
    .info-icon {
        color: #0d6efd;
        margin-left: 5px;
        font-size: 0.9em;
    }
</style>
